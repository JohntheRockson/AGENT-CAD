[package]
name = "inspect-m8"
version = "0.1.0"
edition = "2021"
publish = false
description = "Inspector: golden M8×40 fillet + STEP/STL report (no kernel edits)"

# Nested single-crate workspace so `cargo run --manifest-path` works without
# adding this package to the repo-root workspace members list.
[workspace]

[dependencies]
kernel = { path = "../../crates/kernel" }
serde_json = "1"

[features]
default = []
occt = ["kernel/occt"]

[patch.crates-io]
occt-wasm = { path = "../../vendor/occt-wasm" }

# Match the repo-root workspace: Cranelift compiling the OCCT WASM module is
# unusable when wasmtime itself is unoptimized.
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.occt-wasm]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
