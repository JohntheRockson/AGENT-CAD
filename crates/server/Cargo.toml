[package]
name    = "server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
kernel     = { path = "../kernel" }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
axum       = { workspace = true }
tower-http          = { workspace = true }
anyhow              = { workspace = true }
bytes               = { workspace = true }
reqwest             = { workspace = true }
dotenvy             = { workspace = true }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["fmt"] }
tokio-stream        = "0.1"
futures-util        = "0.3"

[features]
# `cargo run -p server --release`                   → real OCCT geometry
# `cargo run -p server --no-default-features`       → mock geometry (fast dev)
default = ["occt"]
occt    = ["kernel/occt"]
